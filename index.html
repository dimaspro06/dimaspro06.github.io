<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dimas Pro</title>
    <!-- Memuat Tailwind CSS untuk styling responsif -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            900: '#0f172a',
                            800: '#1e293b',
                            700: '#334155'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Memuat Google Fonts (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .product-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .product-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 10px 10px -5px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

    <!-- Header & Navigasi -->
    <header class="sticky top-0 z-40 bg-slate-900/80 backdrop-blur-md border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center shadow-lg shadow-indigo-500/30">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
                    </svg>
                </div>
                <span class="text-lg sm:text-xl font-bold tracking-tight text-white">Dimas Store RMX</span>
            </div>
            <!-- Info Jumlah Item -->
            <div class="text-xs sm:text-sm text-slate-400 bg-slate-800/80 px-3 py-1.5 rounded-full border border-slate-700">
                Total: <span id="itemCount" class="font-semibold text-indigo-400">20</span> Item Tersedia
            </div>
        </div>
    </header>

    <!-- Konten Utama -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- Bagian Judul -->
        <div class="mb-8">
            <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-white">Jelajahi Koleksi Pilihan</h1>
            <p class="text-slate-400 text-sm sm:text-base mt-1">Temukan game, aplikasi, dan konten digital eksklusif favorit Anda.</p>
        </div>

        <!-- Grid 20 Box Produk -->
        <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Data produk akan dirender otomatis melalui JavaScript -->
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 border-t border-slate-800 mt-12 py-6 text-center text-xs sm:text-sm text-slate-500">
        <p>&copy; 2026 NexusStore Web Responsive. Hak Cipta Dilindungi.</p>
    </footer>

    <!-- Modal Kustom Interaktif (Pengganti alert()) -->
    <div id="customModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300 z-50">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-sm w-full p-6 text-center shadow-2xl transform scale-95 transition-transform duration-300" id="modalContent">
            <div id="modalIcon" class="w-12 h-12 rounded-full mx-auto flex items-center justify-center mb-4 bg-indigo-500/20 text-indigo-400">
                <!-- Icon diset dinamis -->
            </div>
            <h3 id="modalTitle" class="text-lg font-bold text-white mb-2">Judul Notifikasi</h3>
            <p id="modalMessage" class="text-slate-300 text-sm mb-6">Pesan detail akan tampil di sini.</p>
            <button onclick="closeModal()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 rounded-xl transition-all shadow-lg shadow-indigo-600/30">
                Tutup
            </button>
        </div>
    </div>

    <!-- JavaScript untuk 20 Data Produk & Interaksi -->
    <script>
        // Array Data 20 Produk / Game / Item
        const products = [
            { id: 1, title: "Dimas Pro", category: "Game", price: "Rp 299.000", desc: "king groza", image: "https://placehold.co/600x400/4f46e5/ffffff?text=Dimas+Pro" },
            { id: 2, title: "Dimas Pro", category: "Game", price: "Rp 299.000", desc: "king groza", image: "https://placehold.co/600x400/4f46e5/ffffff?text=Dimas+Pro" },
            { id: 3, title: "Dimas Pro", category: "Game", price: "Rp 299.000", desc: "king groza", image: "https://placehold.co/600x400/4f46e5/ffffff?text=Dimas+Pro" },
            { id: 4, title: "Dimas Pro", category: "Game", price: "Rp 299.000", desc: "king groza", image: "https://placehold.co/600x400/4f46e5/ffffff?text=Dimas+Pro" },
            { id: 5, title: "Dimas Pro", category: "Game", price: "Rp 299.000", desc: "king groza", image: "https://placehold.co/600x400/4f46e5/ffffff?text=Dimas+Pro" },
            { id: 6, title: "Dimas Pro", category: "Game", price: "Rp 299.000", desc: "king groza", image: "https://placehold.co/600x400/4f46e5/ffffff?text=Dimas+Pro" },
            { id: 7, title: "Dimas Pro", category: "Game", price: "Rp 299.000", desc: "king groza", image: "https://placehold.co/600x400/4f46e5/ffffff?text=Dimas+Pro" },
            { id: 8, title: "Dimas Pro", category: "Game", price: "Rp 299.000", desc: "king groza", image: "https://placehold.co/600x400/4f46e5/ffffff?text=Dimas+Pro" },
            
        ];

        // Fungsi untuk merender produk ke dalam DOM
        function renderProducts(items) {
            const grid = document.getElementById('productGrid');
            const itemCount = document.getElementById('itemCount');
            
            grid.innerHTML = '';
            itemCount.textContent = items.length;

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = "product-card bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-lg flex flex-col justify-between";
                
                card.innerHTML = `
                    <div>
                        <!-- Bagian Gambar & Tombol Play Overlay -->
                        <div class="relative group overflow-hidden aspect-video">
                            <img src="${item.image}" 
                                 alt="${item.title}" 
                                 class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105"
                                 onerror="this.src='https://placehold.co/600x400/334155/ffffff?text=Image+Not+Found'">
                            
                            <div class="absolute inset-0 bg-gradient-to-t from-slate-950/80 via-transparent to-transparent opacity-60 group-hover:opacity-80 transition-opacity"></div>

                            <!-- Tombol Play Tengah -->
                            <button onclick="handlePlay('${item.title}')" 
                                    class="absolute inset-0 m-auto w-12 h-12 bg-indigo-600/90 hover:bg-indigo-500 text-white rounded-full flex items-center justify-center shadow-lg transform scale-90 group-hover:scale-100 transition-all duration-300 focus:outline-none">
                                <svg class="w-5 h-5 translate-x-0.5" fill="currentColor" viewBox="0 0 24 24">
                                    <path d="M8 5v14l11-7z"/>
                                </svg>
                            </button>
                        </div>

                        <!-- Konten Teks -->
                        <div class="p-4 sm:p-5">
                            <div class="flex items-start justify-between gap-2 mb-1.5">
                                <h3 class="text-base sm:text-lg font-bold text-white tracking-tight line-clamp-1">${item.title}</h3>
                            </div>
                            <span class="text-emerald-400 font-bold text-sm sm:text-base block mb-2">${item.price}</span>
                            <p class="text-slate-400 text-xs sm:text-sm line-clamp-2 leading-relaxed mb-2">
                                ${item.desc}
                            </p>
                        </div>
                    </div>

                    <!-- Tombol Aksi Bawah (Play & Buy) -->
                    <div class="p-4 sm:p-5 pt-0 grid grid-cols-2 gap-2">
                        <button onclick="handlePlay('${item.title}')" 
                                class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs sm:text-sm font-medium py-2 px-3 rounded-xl flex items-center justify-center space-x-1.5 transition-all">
                            <svg class="w-4 h-4 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/>
                            </svg>
                            <span>Preview</span>
                        </button>

                        <button onclick="handleBuy('${item.title}')" 
                                class="w-full bg-indigo-600 hover:bg-indigo-500 text-white text-xs sm:text-sm font-medium py-2 px-3 rounded-xl flex items-center justify-center space-x-1.5 shadow-md shadow-indigo-600/30 transition-all">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>
                            </svg>
                            <span>Beli</span>
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Modal Kustom Interaktif
        function showModal(title, message, type = 'play') {
            const modal = document.getElementById('customModal');
            const modalContent = document.getElementById('modalContent');
            const modalTitle = document.getElementById('modalTitle');
            const modalMessage = document.getElementById('modalMessage');
            const modalIcon = document.getElementById('modalIcon');

            modalTitle.textContent = title;
            modalMessage.textContent = message;

            if (type === 'play') {
                modalIcon.innerHTML = `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>`;
            } else {
                modalIcon.innerHTML = `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>`;
            }

            modal.classList.remove('opacity-0', 'pointer-events-none');
            modalContent.classList.remove('scale-95');
            modalContent.classList.add('scale-100');
        }

        function closeModal() {
            const modal = document.getElementById('customModal');
            const modalContent = document.getElementById('modalContent');

            modal.classList.add('opacity-0', 'pointer-events-none');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');
        }

        function handlePlay(title) {
            showModal("Mode Preview", `Memuat demo interaktif untuk "${title}"...`, "play");
        }

        function handleBuy(title) {
            showModal("Berhasil Masuk Keranjang", `"${title}" telah berhasil ditambahkan ke keranjang belanja Anda.`, "buy");
        }

        // Inisialisasi render pertama kali saat halaman dimuat
        window.onload = function() {
            renderProducts(products);
        };
    </script>
</body>
</html>
